name: Build and Release

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: banbury-website-prod
  ECS_SERVICE: banbury-website-prod
  ECS_CLUSTER: banbury
  ECS_TASK_DEFINITION: .aws/deploy-prod.json
  CONTAINER_NAME: banbury-website-prod

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.16.0'
          cache: 'npm'

      - name: Install dependencies
        run: |
          cd packages
          npm install

      - name: Run ESLint
        run: |
          cd packages
          npm run lint

  unit-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.16.0'
          cache: 'npm'

      - name: Install dependencies
        run: |
          cd packages
          npm install

      - name: Run Tests
        run: |
          cd packages
          npm test

  deploy:
    needs: [lint, unit-tests]
    if: github.ref == 'refs/heads/main'
    name: Deploy
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          BROWSERBASE_API_KEY: ${{ secrets.BROWSERBASE_API_KEY }}
          BROWSERBASE_PROJECT_ID: ${{ secrets.BROWSERBASE_PROJECT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ZEP_API_KEY: ${{ secrets.ZEP_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: |
          docker build --build-arg BROWSERBASE_API_KEY=$BROWSERBASE_API_KEY --build-arg BROWSERBASE_PROJECT_ID=$BROWSERBASE_PROJECT_ID --build-arg OPENAI_API_KEY=$OPENAI_API_KEY --build-arg ZEP_API_KEY=$ZEP_API_KEY --build-arg ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY --build-arg TAVILY_API_KEY=$TAVILY_API_KEY -f packages/Dockerfile -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ./packages
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Update task definition with environment variables
        id: update-task-def
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          BROWSERBASE_API_KEY: ${{ secrets.BROWSERBASE_API_KEY }}
          BROWSERBASE_PROJECT_ID: ${{ secrets.BROWSERBASE_PROJECT_ID }}
          ZEP_API_KEY: ${{ secrets.ZEP_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          # Read the task definition and update environment variables
          jq --arg anthropic "$ANTHROPIC_API_KEY" \
             --arg openai "$OPENAI_API_KEY" \
             --arg google "$GOOGLE_API_KEY" \
             --arg browserbase "$BROWSERBASE_API_KEY" \
             --arg browserbase_proj "$BROWSERBASE_PROJECT_ID" \
             --arg zep "$ZEP_API_KEY" \
             --arg tavily "$TAVILY_API_KEY" \
             --arg api_base "$API_BASE_URL" \
             '.containerDefinitions[0].environment = [
               {"name": "ANTHROPIC_API_KEY", "value": $anthropic},
               {"name": "OPENAI_API_KEY", "value": $openai},
               {"name": "GOOGLE_API_KEY", "value": $google},
               {"name": "BROWSERBASE_API_KEY", "value": $browserbase},
               {"name": "BROWSERBASE_PROJECT_ID", "value": $browserbase_proj},
               {"name": "ZEP_API_KEY", "value": $zep},
               {"name": "TAVILY_API_KEY", "value": $tavily},
               {"name": "API_BASE_URL", "value": $api_base}
             ]' ${{ env.ECS_TASK_DEFINITION }} > task-def-updated.json

      - name: Fill in the new image ID in the Amazon ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-def-updated.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

  deploy-dev:
    needs: [lint, unit-tests]
    if: github.ref == 'refs/heads/dev'
    name: Deploy Dev
    runs-on: ubuntu-latest
    environment: development
    env:
      ECS_SERVICE: banbury-website-dev
      ECS_TASK_DEFINITION: .aws/deploy-dev.json
      CONTAINER_NAME: banbury-website-dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          BROWSERBASE_API_KEY: ${{ secrets.BROWSERBASE_API_KEY }}
          BROWSERBASE_PROJECT_ID: ${{ secrets.BROWSERBASE_PROJECT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ZEP_API_KEY: ${{ secrets.ZEP_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: |
          docker build --build-arg BROWSERBASE_API_KEY=$BROWSERBASE_API_KEY --build-arg BROWSERBASE_PROJECT_ID=$BROWSERBASE_PROJECT_ID --build-arg OPENAI_API_KEY=$OPENAI_API_KEY --build-arg ZEP_API_KEY=$ZEP_API_KEY --build-arg ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY --build-arg TAVILY_API_KEY=$TAVILY_API_KEY -f packages/Dockerfile -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ./packages
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Update task definition with environment variables
        id: update-task-def
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          BROWSERBASE_API_KEY: ${{ secrets.BROWSERBASE_API_KEY }}
          BROWSERBASE_PROJECT_ID: ${{ secrets.BROWSERBASE_PROJECT_ID }}
          ZEP_API_KEY: ${{ secrets.ZEP_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          # Read the task definition and update environment variables
          jq --arg anthropic "$ANTHROPIC_API_KEY" \
             --arg openai "$OPENAI_API_KEY" \
             --arg google "$GOOGLE_API_KEY" \
             --arg browserbase "$BROWSERBASE_API_KEY" \
             --arg browserbase_proj "$BROWSERBASE_PROJECT_ID" \
             --arg zep "$ZEP_API_KEY" \
             --arg tavily "$TAVILY_API_KEY" \
             --arg api_base "$API_BASE_URL" \
             '.containerDefinitions[0].environment = [
               {"name": "ANTHROPIC_API_KEY", "value": $anthropic},
               {"name": "OPENAI_API_KEY", "value": $openai},
               {"name": "GOOGLE_API_KEY", "value": $google},
               {"name": "BROWSERBASE_API_KEY", "value": $browserbase},
               {"name": "BROWSERBASE_PROJECT_ID", "value": $browserbase_proj},
               {"name": "ZEP_API_KEY", "value": $zep},
               {"name": "TAVILY_API_KEY", "value": $tavily},
               {"name": "API_BASE_URL", "value": $api_base}
             ]' ${{ env.ECS_TASK_DEFINITION }} > task-def-updated.json

      - name: Fill in the new image ID in the Amazon ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-def-updated.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

  # Desktop App Build Job
  # Builds Electron desktop distributables for Windows, macOS, and Linux
  # Runs independently of web deployment to avoid impacting existing builds
  build-desktop:
    needs: [lint, unit-tests]
    if: github.ref == 'refs/heads/main'
    name: Build Desktop App (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.16.0'
          cache: 'npm'

      - name: Install dependencies
        run: |
          cd packages
          npm install

      - name: Build Electron TypeScript
        run: |
          cd packages
          npm run desktop:build
        continue-on-error: true

      - name: Build Desktop Distributables
        run: |
          cd packages
          npm run desktop:dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DESKTOP_APP_PROD_URL: ${{ secrets.DESKTOP_APP_PROD_URL }}
        continue-on-error: true

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: |
            packages/dist/*.exe
            packages/dist/*.dmg
            packages/dist/*.AppImage
            packages/dist/*.deb
            packages/dist/*.rpm
            packages/dist/*.zip
          if-no-files-found: warn
          retention-days: 30
