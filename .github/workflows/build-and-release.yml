name: Build and Release

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: banbury-website-prod
  ECS_SERVICE: banbury-website-prod
  ECS_CLUSTER: banbury
  ECS_TASK_DEFINITION: .aws/deploy-prod.json
  CONTAINER_NAME: banbury-website-prod

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.16.0'
          cache: 'npm'

      - name: Install dependencies
        run: |
          cd packages
          npm install

      - name: Run ESLint
        run: |
          cd packages
          npm run lint

  unit-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.16.0'
          cache: 'npm'

      - name: Install dependencies
        run: |
          cd packages
          npm install

      - name: Run Tests
        run: |
          cd packages
          npm test

  deploy:
    needs: [lint, unit-tests]
    if: github.ref == 'refs/heads/main'
    name: Deploy
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          BROWSERBASE_API_KEY: ${{ secrets.BROWSERBASE_API_KEY }}
          BROWSERBASE_PROJECT_ID: ${{ secrets.BROWSERBASE_PROJECT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ZEP_API_KEY: ${{ secrets.ZEP_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: |
          docker build --build-arg BROWSERBASE_API_KEY=$BROWSERBASE_API_KEY --build-arg BROWSERBASE_PROJECT_ID=$BROWSERBASE_PROJECT_ID --build-arg OPENAI_API_KEY=$OPENAI_API_KEY --build-arg ZEP_API_KEY=$ZEP_API_KEY --build-arg ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY --build-arg TAVILY_API_KEY=$TAVILY_API_KEY -f packages/Dockerfile -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ./packages
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Update task definition with environment variables
        id: update-task-def
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          BROWSERBASE_API_KEY: ${{ secrets.BROWSERBASE_API_KEY }}
          BROWSERBASE_PROJECT_ID: ${{ secrets.BROWSERBASE_PROJECT_ID }}
          ZEP_API_KEY: ${{ secrets.ZEP_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          # Read the task definition and update environment variables
          jq --arg anthropic "$ANTHROPIC_API_KEY" \
             --arg openai "$OPENAI_API_KEY" \
             --arg google "$GOOGLE_API_KEY" \
             --arg browserbase "$BROWSERBASE_API_KEY" \
             --arg browserbase_proj "$BROWSERBASE_PROJECT_ID" \
             --arg zep "$ZEP_API_KEY" \
             --arg tavily "$TAVILY_API_KEY" \
             --arg api_base "$API_BASE_URL" \
             '.containerDefinitions[0].environment = [
               {"name": "ANTHROPIC_API_KEY", "value": $anthropic},
               {"name": "OPENAI_API_KEY", "value": $openai},
               {"name": "GOOGLE_API_KEY", "value": $google},
               {"name": "BROWSERBASE_API_KEY", "value": $browserbase},
               {"name": "BROWSERBASE_PROJECT_ID", "value": $browserbase_proj},
               {"name": "ZEP_API_KEY", "value": $zep},
               {"name": "TAVILY_API_KEY", "value": $tavily},
               {"name": "API_BASE_URL", "value": $api_base}
             ]' ${{ env.ECS_TASK_DEFINITION }} > task-def-updated.json

      - name: Fill in the new image ID in the Amazon ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-def-updated.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

  deploy-dev:
    needs: [lint, unit-tests]
    if: github.ref == 'refs/heads/dev'
    name: Deploy Dev
    runs-on: ubuntu-latest
    environment: development
    env:
      ECS_SERVICE: banbury-website-dev
      ECS_TASK_DEFINITION: .aws/deploy-dev.json
      CONTAINER_NAME: banbury-website-dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          BROWSERBASE_API_KEY: ${{ secrets.BROWSERBASE_API_KEY }}
          BROWSERBASE_PROJECT_ID: ${{ secrets.BROWSERBASE_PROJECT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ZEP_API_KEY: ${{ secrets.ZEP_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: |
          docker build --build-arg BROWSERBASE_API_KEY=$BROWSERBASE_API_KEY --build-arg BROWSERBASE_PROJECT_ID=$BROWSERBASE_PROJECT_ID --build-arg OPENAI_API_KEY=$OPENAI_API_KEY --build-arg ZEP_API_KEY=$ZEP_API_KEY --build-arg ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY --build-arg TAVILY_API_KEY=$TAVILY_API_KEY -f packages/Dockerfile -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ./packages
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Update task definition with environment variables
        id: update-task-def
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          BROWSERBASE_API_KEY: ${{ secrets.BROWSERBASE_API_KEY }}
          BROWSERBASE_PROJECT_ID: ${{ secrets.BROWSERBASE_PROJECT_ID }}
          ZEP_API_KEY: ${{ secrets.ZEP_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          # Read the task definition and update environment variables
          jq --arg anthropic "$ANTHROPIC_API_KEY" \
             --arg openai "$OPENAI_API_KEY" \
             --arg google "$GOOGLE_API_KEY" \
             --arg browserbase "$BROWSERBASE_API_KEY" \
             --arg browserbase_proj "$BROWSERBASE_PROJECT_ID" \
             --arg zep "$ZEP_API_KEY" \
             --arg tavily "$TAVILY_API_KEY" \
             --arg api_base "$API_BASE_URL" \
             '.containerDefinitions[0].environment = [
               {"name": "ANTHROPIC_API_KEY", "value": $anthropic},
               {"name": "OPENAI_API_KEY", "value": $openai},
               {"name": "GOOGLE_API_KEY", "value": $google},
               {"name": "BROWSERBASE_API_KEY", "value": $browserbase},
               {"name": "BROWSERBASE_PROJECT_ID", "value": $browserbase_proj},
               {"name": "ZEP_API_KEY", "value": $zep},
               {"name": "TAVILY_API_KEY", "value": $tavily},
               {"name": "API_BASE_URL", "value": $api_base}
             ]' ${{ env.ECS_TASK_DEFINITION }} > task-def-updated.json

      - name: Fill in the new image ID in the Amazon ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-def-updated.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

  # Desktop App Build Job
  # Builds Electron desktop distributables for Windows, macOS, and Linux
  # Runs independently of web deployment to avoid impacting existing builds
  build-desktop:
    needs: [lint, unit-tests]
    if: github.ref == 'refs/heads/main'
    name: Build Desktop App (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.16.0'
          cache: 'npm'

      - name: Install dependencies
        run: |
          cd packages
          npm install

      - name: Build Electron TypeScript
        run: |
          cd packages
          npm run desktop:build
        continue-on-error: true

      - name: Build Desktop Distributables
        run: |
          cd packages
          npm run desktop:dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DESKTOP_APP_PROD_URL: ${{ secrets.DESKTOP_APP_PROD_URL }}
        continue-on-error: true

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: |
            packages/dist-electron-build/*.exe
            packages/dist-electron-build/*.dmg
            packages/dist-electron-build/*.AppImage
            packages/dist-electron-build/*.deb
            packages/dist-electron-build/*.rpm
            packages/dist-electron-build/*.zip
          if-no-files-found: warn
          retention-days: 30

  # Release Job
  # Creates a GitHub release with Electron desktop app artifacts
  # Only runs on main branch after successful desktop builds
  release:
    needs: [build-desktop]
    if: github.ref == 'refs/heads/main'
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version from package.json
        id: get-version
        run: |
          cd packages
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Download all desktop artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: desktop-*

      - name: List downloaded artifacts
        run: |
          echo "Downloaded artifacts:"
          find release-artifacts -type f -name "*" || echo "No artifacts found"
          ls -la release-artifacts/ || true

      - name: Check for artifacts
        id: check-artifacts
        run: |
          if find release-artifacts -type f 2>/dev/null | grep -q .; then
            echo "artifacts_exist=true" >> $GITHUB_OUTPUT
            echo "Artifacts found, proceeding with release"
          else
            echo "artifacts_exist=false" >> $GITHUB_OUTPUT
            echo "No artifacts found, skipping release"
          fi

      - name: Create Release
        if: steps.check-artifacts.outputs.artifacts_exist == 'true'
        id: create-release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.get-version.outputs.version }}
          name: Release v${{ steps.get-version.outputs.version }}
          body: |
            ## Desktop App Release
            
            Download the Banbury desktop app for your platform:
            
            - **Windows**: `.exe` installer (NSIS)
            - **macOS**: `.dmg` file (Intel x64 and Apple Silicon arm64)
            - **Linux**: `.AppImage`, `.deb`, or `.rpm` packages
            
            ### Installation Instructions
            
            **Windows:**
            - Download the `.exe` file and run it to install
            - The installer will create desktop and start menu shortcuts
            
            **macOS:**
            - Download the `.dmg` file
            - Open the DMG and drag Banbury to your Applications folder
            - For Apple Silicon Macs, download the arm64 version
            - For Intel Macs, download the x64 version
            
            **Linux:**
            - **AppImage**: Make executable (`chmod +x`) and run directly
            - **Debian/Ubuntu**: Install with `sudo dpkg -i *.deb`
            - **Red Hat/Fedora**: Install with `sudo rpm -i *.rpm`
            
            ### Changes
            - Built from commit ${{ github.sha }}
            - See commit history for detailed changes
          files: |
            release-artifacts/**/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
